- name: Blogs
  items:
  - title: The Aperiodical
    url: https://aperiodical.com/
    feed: https://aperiodical.com/feed/rss/
    image: aperiodical.png
    description: "Your one-stop shop for all the latest in maths and maths communication! I'm a big fan at the moment of <a href=\"https://colinbeveridge.co.uk/\" target=\"_blank\">Colin Beveridge</a>'s weekly roundup <a href=\"https://aperiodical.com/category/columns/double-maths-first-thing/\" target=\"_blank\">Double Maths First Thing</a> (numbered in hexadecimal for your regular non-base-10 fix!)."

  - title: Shellsharks Scrolls
    url: https://shellsharks.com/scrolls/
    feed: https://shellsharks.com/feeds/scroll-feed.xml
    image: scrolls.png
    description: "A weekly roundup of going-ons in the IndieWeb and the Fediverse, with a bit of cybersecurity thrown in, too (the main <a href=\"https://shellsharks.com/\" target=\"_blank\">Shellsharks</a> site isn't bad, either!)."

  - title: IndieNews
    url: https://news.indieweb.org/en
    feed: https://granary-demo.appspot.com/url?input=html&output=atom&url=https%3A%2F%2Fnews.indieweb.org%2Fen
    image: indieweb.svg
    description: "What everyone's up to on the IndieWeb."

  - title: HeydonWorks
    url: https://heydonworks.com/
    feed: https://heydonworks.com/feed.xml
    image: heydonworks.svg
    description: "Everything web design. I'm enjoying their series explaining every HTML element (<a href=\"https://heydonworks.com/article/the-anchor-element/\">start here with the anchor element!</a>)."

