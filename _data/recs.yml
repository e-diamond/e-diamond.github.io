- name: Podcasts
  items:
  - title: No Such Thing As A Fish
    url: https://www.nosuchthingasafish.com/
    feed: https://audioboom.com/channels/2399216.rss
    image: no-such-thing-as-a-fish.png
    description: "I actually don't listen to podcasts a lot, but when I do it's this one. Four researchers from <a href=\"https://www.qi.com/\">QI</a> (the best panel show) share their favourite facts from the last seven days."

  - title: The Infinite Monkey Cage
    url: https://www.bbc.co.uk/programmes/b00snr0w
    feed: https://podcasts.files.bbci.co.uk/b00snr0w.rss
    image: infinite-monkey-cage.jpg
    description: Okay, okay, I listen to this one sometimes, too ;). Brian Cox and Robin Ince bring scientists and comedians together to investigate life, the universe, and everything.

