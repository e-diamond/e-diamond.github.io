---
layout: default
--- 

<main class="h-feed" id="main">
    <h1 class="tagpage-title p-name">Tagged: <span class="header-tag">{{ page.title }}</span></h1>

    {% case page.collection %}
        {% when "blog" %}
            {%- include postcards.html posts=page.tagged_posts -%}
        {% when "bookmarks" %}
            {%- include bookmark-cards.html bookmarks=page.tagged_posts -%}
    {% endcase %}
</main>
